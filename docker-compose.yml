services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the app in a container too (`docker compose --profile app up`).
  app:
    build: .
    profiles: ["app"]
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: mongodb://mongo:27017/ott_platform
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    volumes:
      - ./media:/app/media:ro
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
