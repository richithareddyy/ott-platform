<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamBox</title>
  <meta name="description" content="Browse, search, and stream movies and series." />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Stream<span>Box</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/browse" data-nav="browse">Browse</a>
      <a href="#/my-list" data-nav="my-list" class="auth-only">My List</a>
      <a href="#/admin" data-nav="admin" class="admin-only">Admin</a>
    </nav>
    <form class="search" id="search-form" role="search">
      <input type="search" id="search-input" placeholder="Search titles, cast…" aria-label="Search" maxlength="100" />
    </form>
    <div class="account" id="account"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
